repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '^(form|submit)\.yml\.erb$'
      - id: check-added-large-files
        # template/3Dmol.min.js (~500 KB) is vendored deliberately so the
        # report's interactive viewer loads from the same origin.
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
